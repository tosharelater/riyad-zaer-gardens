<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Riyad Zaer Gardens — Coming soon</title>
<meta name="description" content="Riyad Zaer Gardens, nouveau pôle urbain à 25 minutes de Rabat. Coming soon.">
<meta name="theme-color" content="#0b3734">
<link rel="icon" href="assets/logo.webp">
<link rel="preload" href="assets/fonts/Audrey-Medium.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="assets/building-crop.webp" as="image">
<style>
  @font-face { font-family: 'RZ Audrey'; src: url(assets/fonts/Audrey-Medium.otf) format('opentype'); font-weight: 500; font-display: swap; }
  @font-face { font-family: 'RZ Audrey'; src: url(assets/fonts/Audrey-Normal.otf) format('opentype'); font-weight: 400; font-display: swap; }

  :root {
    --fill: #0b3734;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --bw: min(100vw, 120svh);
    --lu: calc(max(100vw, 100svh * 0.8) / 1082);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--fill); height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background:
      radial-gradient(70% 45% at 50% 20%, #0f4541 0%, transparent 72%),
      var(--fill);
    color: #fff;
    font-family: 'RZ Audrey', 'Cinzel', Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }

  .shape { position: absolute; pointer-events: none; will-change: transform; }
  .shape img { display: block; width: 100%; height: auto; }
  .shape.a { right: calc(var(--lu) * -150); top: 2svh; width: calc(var(--lu) * 723); animation: drift-a 24s ease-in-out infinite alternate; }
  .shape.b { left: calc(var(--lu) * -420); top: 16svh; width: calc(var(--lu) * 723); animation: drift-b 30s ease-in-out infinite alternate; }
  @keyframes drift-a { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-2%, -1.5%, 0); } }
  @keyframes drift-b { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(2%, 1.2%, 0); } }

  .head {
    flex: none;
    position: relative;
    z-index: 3;
    display: grid;
    justify-items: center;
    gap: clamp(0.35rem, 1.4svh, 0.8rem);
    padding: clamp(1rem, 3.6svh, 2.4rem) 1rem 0;
    text-align: center;
  }
  .words { display: grid; justify-items: center; gap: clamp(0.35rem, 1.4svh, 0.8rem); }
  .logo { width: clamp(4.6rem, 12svh, 8.2rem); height: auto; display: block; }
  h1 {
    font-weight: 500;
    font-size: clamp(1.5rem, min(6.6vw, 6.4svh), 3.4rem);
    line-height: 1;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    white-space: nowrap;
    padding-left: 0.07em;
  }
  .sub {
    font-weight: 400;
    font-size: clamp(0.72rem, min(3.3vw, 2.3svh), 1.2rem);
    line-height: 1.5;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgb(246 240 228 / 0.92);
    padding-left: 0.2em;
  }

  .scene { position: relative; flex: 1 1 auto; z-index: 2; }
  .building {
    position: absolute;
    z-index: 2;
    left: 50%;
    bottom: 0;
    width: var(--bw);
    aspect-ratio: 1082 / 640;
    translate: -50% 0;
    -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 74%, transparent 98%), linear-gradient(to right, transparent 0%, rgb(0 0 0 / 0.08) 3%, rgb(0 0 0 / 0.25) 6%, rgb(0 0 0 / 0.55) 9.5%, rgb(0 0 0 / 0.85) 13%, #000 17%, #000 83%, rgb(0 0 0 / 0.85) 87%, rgb(0 0 0 / 0.55) 90.5%, rgb(0 0 0 / 0.25) 94%, rgb(0 0 0 / 0.08) 97%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(to bottom, #000 0, #000 74%, transparent 98%), linear-gradient(to right, transparent 0%, rgb(0 0 0 / 0.08) 3%, rgb(0 0 0 / 0.25) 6%, rgb(0 0 0 / 0.55) 9.5%, rgb(0 0 0 / 0.85) 13%, #000 17%, #000 83%, rgb(0 0 0 / 0.85) 87%, rgb(0 0 0 / 0.55) 90.5%, rgb(0 0 0 / 0.25) 94%, rgb(0 0 0 / 0.08) 97%, transparent 100%);
    mask-composite: intersect;
  }
  .glow {
    position: absolute;
    z-index: 1;
    left: 50%;
    bottom: 0;
    width: calc(var(--bw) * 1.1);
    aspect-ratio: 1082 / 640;
    translate: -50% 0;
    background: radial-gradient(50% 52% at 50% 60%, rgb(224 190 110 / 0.22), transparent 70%);
    pointer-events: none;
  }
  .building canvas, .building img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .building img { opacity: 0; }
  .no-gl .building img { opacity: 1; }
  .no-gl .building canvas { display: none; }

  @media (orientation: portrait) {
    :root { --bw: 100vw; --lu: calc(150vw / 1082); }
    .head {
      flex: 1 1 auto;
      grid-template-rows: auto 1fr;
      gap: 0;
      padding: clamp(1.6rem, 5.5svh, 3.2rem) 1rem 0;
    }
    .logo { width: min(44vw, 17svh); }
    .words { align-self: center; gap: clamp(0.9rem, 2.6svh, 1.6rem); padding-bottom: 3svh; }
    h1 { font-size: min(10.6vw, 8.6svh); }
    .sub { font-size: min(4.2vw, 2.9svh); line-height: 1.6; }
    .scene { flex: none; height: calc(100vw * 640 / 1082); }
    .building, .glow { bottom: 0; top: auto; translate: -50% 0; }
  }
  @media (max-height: 520px) and (orientation: landscape) {
    :root { --bw: min(80vw, 120svh); }
    .sub { display: none; }
    .logo { width: 3.6rem; }
    h1 { font-size: 1.4rem; }
  }

  .foot {
    display: none;
    position: absolute;
    z-index: 3;
    left: 0;
    right: 0;
    bottom: calc(1.4rem + env(safe-area-inset-bottom));
    width: 100%;
    text-align: center;
    font-weight: 400;
    font-size: 0.72rem;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: rgb(246 240 228 / 0.62);
    padding-left: 0.26em;
  }

  .logo, h1, .sub { opacity: 0; }
  .building { opacity: 0; }
  .go .logo { animation: rise 1.1s var(--ease) 0.1s forwards; }
  .go h1 { animation: title 1.5s var(--ease) 0.3s forwards; }
  .go .sub { animation: rise 1.2s var(--ease) 0.7s forwards; }
  .go .foot { animation: rise 1.2s var(--ease) 1.4s both; }
  .go .building { animation: unveil 2s var(--ease) 0.5s forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes title {
    from { opacity: 0; letter-spacing: 0.2em; transform: translateY(10px); filter: blur(6px); }
    to { opacity: 1; letter-spacing: 0.07em; transform: none; filter: blur(0); }
  }
  @keyframes unveil {
    from { opacity: 0; transform: translateY(46px); filter: blur(8px); }
    to { opacity: 1; transform: none; filter: blur(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .shape, .logo, h1, .sub, .building { animation: none !important; opacity: 1; filter: none; }
  }
</style>
</head>
<body>
<div class="shape a" aria-hidden="true"><img src="assets/Shape_1.webp" alt=""></div>
<div class="shape b" aria-hidden="true"><img src="assets/Shape_1_copy.webp" alt=""></div>

<header class="head">
  <img class="logo" src="assets/logo.webp" alt="Riyad Zaer Gardens" width="720" height="468">
  <div class="words">
    <h1>Coming Soon</h1>
    <p class="sub">Nouveau pôle urbain<br>à 25 minutes de Rabat</p>
  </div>
</header>

<div class="scene">
<div class="glow" aria-hidden="true"></div>

<div class="building" role="img" aria-label="Un immeuble de Riyad Zaer Gardens recouvert d'un grand voile vert">
  <canvas id="gl" width="1082" height="640"></canvas>
  <img src="assets/building-crop.webp" alt="" width="1082" height="640">
</div>
<p class="foot">Avenue Mohammed VI, Rabat</p>
</div>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  ['gesturestart', 'gesturechange', 'gestureend'].forEach((ev) => document.addEventListener(ev, (e) => e.preventDefault()));
  document.addEventListener('touchmove', (e) => { if (e.touches.length > 1 || e.scale && e.scale !== 1) e.preventDefault(); }, { passive: false });
  let lastTap = 0;
  document.addEventListener('touchend', (e) => { const n = Date.now(); if (n - lastTap < 350) e.preventDefault(); lastTap = n; }, { passive: false });
  document.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

  const start = () => document.body.classList.add('go');
  (document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 900))]) : Promise.resolve()).then(start);

  const cv = document.getElementById('gl');
  const gl = cv.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: false });
  if (!gl) { document.body.classList.add('no-gl'); return; }

  const vs = `attribute vec2 p; varying vec2 uv;
    void main(){ uv = vec2(p.x*0.5+0.5, 0.5-p.y*0.5); gl_Position = vec4(p,0.0,1.0); }`;
  const fs = `precision mediump float;
    uniform sampler2D uI; uniform sampler2D uM;
    uniform float t; uniform float amp; uniform float gust; uniform float mx;
    varying vec2 uv;
    void main(){
      float m = texture2D(uM, uv).r;
      float wy = smoothstep(0.02, 0.36, uv.y) * (1.0 - smoothstep(0.84, 0.98, uv.y));
      float w = m * (0.25 + 0.75 * wy);
      float breeze = 0.72 + 0.28 * sin(t*0.42 + uv.x*2.2) + 0.12 * sin(t*0.93 + uv.y*3.0);
      float k = amp * breeze * (1.0 + gust);
      vec2 d = vec2(
        sin(uv.y*8.0 + t*1.0 + uv.x*3.0)*0.68 + sin(uv.y*19.0 - t*1.25 + uv.x*7.0)*0.16,
        cos(uv.x*11.0 + t*0.8 + uv.y*3.0)*0.36 + sin(uv.x*21.0 + t*1.05)*0.07);
      vec2 uv2 = uv + d * w * k * vec2(0.0046, 0.0042) + vec2((mx-0.5)*0.004*w, 0.0);
      vec4 c = texture2D(uI, uv2);
      float l = dot(c.rgb, vec3(0.30, 0.59, 0.11)) / max(c.a, 0.001);
      float band = uv.x*0.9 + uv.y*0.55 - t*0.05;
      float sw = exp(-pow((fract(band) - 0.5) * 7.0, 2.0));
      float ridge = smoothstep(0.16, 0.5, l);
      c.rgb += vec3(0.55, 0.5, 0.24) * sw * ridge * m * 0.28 * c.a;
      c.rgb *= 1.0 + d.x * 0.07 * m * k;
      gl_FragColor = c;
    }`;
  function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { document.body.classList.add('no-gl'); return; }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const U = (n) => gl.getUniformLocation(prog, n);
  const uT = U('t'), uAmp = U('amp'), uGust = U('gust'), uMx = U('mx');
  gl.uniform1i(U('uI'), 0); gl.uniform1i(U('uM'), 1);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);

  function tex(unit, image) {
    const tx = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tx);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }
  const load = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

  const SPEED = 0.8;
  let gust = 0, mx = 0.5, t = 0, last = performance.now(), born = last;
  addEventListener('pointermove', (e) => {
    const nx = e.clientX / innerWidth;
    gust = Math.min(2.2, gust + Math.abs(nx - mx) * 9);
    mx = nx;
  }, { passive: true });
  addEventListener('pointerdown', () => { gust = Math.min(2.6, gust + 1.4); });
  addEventListener('deviceorientation', (e) => {
    if (e.gamma == null) return;
    const nx = 0.5 + Math.max(-30, Math.min(30, e.gamma)) / 60;
    gust = Math.min(2.2, gust + Math.abs(nx - mx) * 6);
    mx = nx;
  });

  Promise.all([load('assets/building-crop.webp'), load('assets/cloth-mask-crop.webp')]).then(([a, b]) => {
    tex(0, a); tex(1, b);
    gl.viewport(0, 0, cv.width, cv.height);
    gl.clearColor(0, 0, 0, 0);
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt * SPEED;
      gust *= Math.exp(-dt * 1.3);
      const age = (now - born) / 1000;
      const settle = 1 + 0.9 * Math.exp(-Math.max(0, age - 0.8) / 2.4);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform1f(uT, t);
      gl.uniform1f(uAmp, reduce ? 0 : 1.0 * settle);
      gl.uniform1f(uGust, reduce ? 0 : gust);
      gl.uniform1f(uMx, mx);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }).catch(() => document.body.classList.add('no-gl'));
})();
</script>
</body>
</html>
