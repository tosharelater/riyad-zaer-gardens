<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Riyad Zaer Gardens — Coming soon</title>
<meta name="description" content="Riyad Zaer Gardens, nouveau pôle urbain à Rabat. Coming soon.">
<meta name="theme-color" content="#0a4136">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #0c4a3c;
    --bg2: #07332b;
    --gold: #c8b568;
    --gold-soft: #d9c987;
    --cream: #f6f0e4;
    --reveal: 0;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg2); }
  body {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    color: var(--cream);
    font-family: 'Poppins', system-ui, sans-serif;
    background:
      radial-gradient(90% 60% at 50% 0%, #0f5646 0%, transparent 70%),
      linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
    -webkit-font-smoothing: antialiased;
  }

  .lines { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.55; }
  .lines path, .lines line { fill: none; stroke: rgb(200 181 104 / 0.2); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
  .lines g { animation: float 26s ease-in-out infinite alternate; }
  .lines g:nth-child(2) { animation-duration: 34s; animation-direction: alternate-reverse; }
  @keyframes float { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(1.5%, -1.2%, 0); } }

  .head {
    position: relative;
    z-index: 2;
    width: min(100%, 60rem);
    padding: clamp(1.5rem, 5vh, 3rem) 1.25rem 0;
    text-align: center;
    display: grid;
    justify-items: center;
    gap: clamp(0.5rem, 1.6vh, 1rem);
  }
  .logo { width: clamp(7rem, 16vw, 10rem); height: auto; }
  h1 {
    font-family: 'Cinzel', 'Trajan Pro', Georgia, serif;
    font-weight: 500;
    font-size: clamp(2.9rem, 10.5vw, 7.2rem);
    line-height: 0.98;
    letter-spacing: 0.035em;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 10px 40px rgb(0 0 0 / 0.35);
  }
  .sub {
    font-family: 'Cinzel', Georgia, serif;
    font-weight: 400;
    font-size: clamp(0.95rem, 3.2vw, 2rem);
    line-height: 1.35;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--cream);
  }

  .stage {
    position: relative;
    z-index: 1;
    width: min(100%, 1240px);
    aspect-ratio: 2752 / 1536;
    margin-top: clamp(-1.5rem, -2vh, 0rem);
    flex: none;
  }
  .photo {
    position: absolute;
    inset: 0;
    background: url(assets/soir-cut.webp) center / 100% 100% no-repeat;
    filter: brightness(calc(0.92 + var(--reveal) * 0.12)) saturate(1.04) drop-shadow(0 30px 40px rgb(0 0 0 / 0.35));
  }
  canvas#cloth { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }

  .actions {
    position: relative;
    z-index: 3;
    display: grid;
    justify-items: center;
    gap: 0.8rem;
    padding: 0 1.25rem calc(1.75rem + env(safe-area-inset-bottom));
    margin-top: clamp(-3.5rem, -5vw, -1rem);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.9rem 1.6rem;
    border-radius: 999px;
    border: 1px solid rgb(217 201 135 / 0.65);
    background: rgb(7 51 43 / 0.55);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    color: var(--cream);
    font: inherit;
    font-size: 0.9rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: background 0.35s var(--ease), color 0.35s var(--ease), transform 0.35s var(--ease), border-color 0.35s var(--ease);
  }
  .btn:hover { background: var(--gold); color: #06261f; border-color: var(--gold); transform: translateY(-2px); }
  .btn svg { width: 1.05rem; height: 1.05rem; transition: transform 0.35s var(--ease); }
  .btn:hover svg { transform: translateX(4px); }
  .foot { font-size: 0.7rem; letter-spacing: 0.24em; text-transform: uppercase; color: rgb(246 240 228 / 0.55); text-align: center; }

  .head > *, .actions > * { opacity: 0; transform: translateY(14px); animation: in 1s var(--ease) forwards; }
  .head > :nth-child(1) { animation-delay: 0.15s; }
  .head > :nth-child(2) { animation-delay: 0.3s; }
  .head > :nth-child(3) { animation-delay: 0.5s; }
  .actions > :nth-child(1) { animation-delay: 1.2s; }
  .actions > :nth-child(2) { animation-delay: 1.4s; }
  .stage { opacity: 0; animation: stagein 1.6s var(--ease) 0.5s forwards; }
  @keyframes in { to { opacity: 1; transform: none; } }
  @keyframes stagein { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

  @media (max-width: 700px) {
    .stage { width: 135%; margin-inline: -17.5%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .lines g, .head > *, .actions > *, .stage { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<svg class="lines" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <g>
    <path d="M700 1000 V420 C700 300 760 230 840 190 C920 230 980 300 980 420 V1000"/>
    <path d="M740 1000 V440 C740 340 790 280 840 250 C890 280 940 340 940 440 V1000"/>
    <line x1="560" y1="1000" x2="560" y2="330"/>
    <line x1="560" y1="330" x2="1000" y2="130"/>
  </g>
  <g>
    <path d="M-20 520 C120 470 240 540 330 640"/>
    <path d="M-20 600 C100 560 200 620 270 700"/>
    <line x1="0" y1="380" x2="190" y2="330"/>
    <path d="M120 1000 V620 C120 560 160 520 200 500"/>
  </g>
</svg>

<header class="head">
  <img class="logo" src="assets/logo.png" alt="Riyad Zaer Gardens" width="720" height="468">
  <h1>Coming<br>Soon</h1>
  <p class="sub">Nouveau pôle urbain<br>à Rabat</p>
</header>

<main class="stage" id="stage">
  <div class="photo" role="img" aria-label="Un immeuble de Riyad Zaer Gardens recouvert d'un grand voile vert"></div>
  <canvas id="cloth"></canvas>
</main>

<div class="actions">
  <button class="btn" id="unveil" type="button">
    <span id="label">Soulever le voile</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
  </button>
  <p class="foot">Riyad Zaer Gardens · Avenue Mohammed VI</p>
</div>

<script>
(() => {
  const root = document.documentElement;
  const cv = document.getElementById('cloth');
  const ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const CW = 560, CH = 350;
  cv.width = CW; cv.height = CH;
  const img = ctx.createImageData(CW, CH);
  const px = img.data;

  const TS = 2048, TAU = Math.PI * 2, SIN = new Float32Array(TS);
  for (let i = 0; i < TS; i++) SIN[i] = Math.sin((i / TS) * TAU);
  const sn = (x) => SIN[((x / TAU * TS) % TS + TS) % TS | 0];
  const cs = (x) => sn(x + Math.PI / 2);
  const sm = (a, b, x) => { const k = Math.max(0, Math.min(1, (x - a) / (b - a))); return k * k * (3 - 2 * k); };

  const D = [4, 32, 24], M = [16, 84, 58], L = [78, 164, 112];

  let lift = 0, target = 0, gust = 0, manual = false, t = 0, last = performance.now();
  const top = new Float32Array(CW), hem = new Float32Array(CW);

  function shape(ys, xf) { return xf; }

  function render() {
    const lyOff = lift * 1.3;
    const G = reduce ? 0 : 1 + gust * 1.6;
    const roof = [[0.142, 0.285], [0.255, 0.008], [0.495, 0.132], [0.52, 0.148], [0.76, 0.242], [0.79, 0.272], [0.868, 0.298]];
    for (let x = 0; x < CW; x++) {
      const xf = x / CW;
      let ty = 0.3;
      for (let i = 0; i < roof.length - 1; i++) {
        const a0 = roof[i], a1 = roof[i + 1];
        if (xf >= a0[0] && xf <= a1[0]) { ty = a0[1] + (a1[1] - a0[1]) * ((xf - a0[0]) / (a1[0] - a0[0])); break; }
      }
      top[x] = ty + (reduce ? 0 : 0.006 * sn(t * 0.7 + xf * 7));
      const s = Math.max(0, Math.min(0.9999, (xf - 0.14) / 0.73)) * 4;
      const fi = Math.floor(s), fr = s - fi;
      const depth = 0.095 * (0.72 + 0.28 * sn(fi * 1.9 + 0.6));
      hem[x] = 0.555 + depth * Math.pow(sn(Math.PI * fr), 0.78)
             + (reduce ? 0 : 0.014 * sn(t * 1.15 + xf * 8.5) * G + 0.006 * sn(t * 2.1 + xf * 17) * G);
    }

    for (let y = 0; y < CH; y++) {
      const yf = y / CH;
      const ys = yf + lyOff;
      for (let x = 0; x < CW; x++) {
        const xf = x / CW;
        const o = (y * CW + x) * 4;
        const tp = top[x], hm = hem[x];
        const left = 0.14 + (reduce ? 0 : 0.007 * sn(t * 1.0 + ys * 16) * G), right = 0.87 + (reduce ? 0 : 0.01 * sn(t * 1.2 + ys * 13 + 1) * G);
        const e = 0.006;
        let a = Math.min(1, Math.max(0, (ys - tp) / e)) * Math.min(1, Math.max(0, (hm - ys) / e))
              * Math.min(1, Math.max(0, (xf - left) / e)) * Math.min(1, Math.max(0, (right - xf) / e));

        if (a <= 0) {
          const d = ys - hm;
          let sh = 0;
          if (d > 0 && d < 0.07 && xf > left && xf < right) { const k = 1 - d / 0.07; sh = 0.5 * k * k; }
          px[o] = 0; px[o + 1] = 6; px[o + 2] = 4; px[o + 3] = sh * 255;
          continue;
        }

        const wv = reduce ? 0 : 0.02 * sn(t * 0.9 + ys * 6 + xf * 4) * (0.3 + ys) * G;
        const s2 = Math.max(0, Math.min(0.9999, (xf - 0.14) / 0.73)) * 4;
        const fr = s2 - Math.floor(s2);
        const sw = Math.max(0, Math.min(0.9999, (xf - 0.14) / 0.73)) * 4;
        const fq = sw - Math.floor(sw);
        const p = (xf + wv) * 13 + (ys - 0.2) * 2.2 + 0.5 * sn(xf * 3.1) + 0.5 * fq;
        const h = 0.62 * cs(p * TAU) + 0.38 * cs((p * 2.1 + 0.31) * TAU + (reduce ? 0 : t * 0.35));
        let l = 0.5 + 0.5 * h * 0.92;
        const yn = (ys - tp) / Math.max(0.05, hm - tp);
        l *= 0.8 + 0.2 * (1 - yn * 0.6);
        l *= 1 - 0.38 * sm(0.82, 1, yn);
        l *= 0.86 + 0.14 * Math.pow(sn(Math.PI * fr), 0.6);
        l *= 1 - 0.22 * sm(0, 0.06, 0.06 - (ys - tp));

        let r, g, b;
        if (l < 0.5) { const k = l * 2; r = D[0] + (M[0] - D[0]) * k; g = D[1] + (M[1] - D[1]) * k; b = D[2] + (M[2] - D[2]) * k; }
        else { const k = (l - 0.5) * 2; r = M[0] + (L[0] - M[0]) * k; g = M[1] + (L[1] - M[1]) * k; b = M[2] + (L[2] - M[2]) * k; }
        const sheen = Math.max(0, l - 0.82) * 1.5;
        r += sheen * 70; g += sheen * 60; b += sheen * 30;
        const rim = Math.max(0, 1 - (ys - tp) / 0.012) * 0.5;
        r += rim * 90; g += rim * 110; b += rim * 80;

        px[o] = r > 255 ? 255 : r; px[o + 1] = g > 255 ? 255 : g; px[o + 2] = b > 255 ? 255 : b; px[o + 3] = a * 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
    lift += (target - lift) * (1 - Math.exp(-dt * 2.6));
    if (Math.abs(target - lift) < 0.0004) lift = target;
    gust *= Math.exp(-dt * 1.5);
    render();
    const rv = lift * lift * (3 - 2 * lift);
    root.style.setProperty('--reveal', Math.min(1, rv * 1.05).toFixed(3));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const label = document.getElementById('label');
  function toggle(v) {
    manual = true;
    target = typeof v === 'number' ? v : (target ? 0 : 1);
    label.textContent = target ? 'Recouvrir le bâtiment' : 'Soulever le voile';
  }
  document.getElementById('unveil').addEventListener('click', () => toggle());
  cv.addEventListener('click', () => toggle());
  addEventListener('keydown', (e) => { if (e.key === 'Escape') toggle(0); });

  let lastX = null;
  addEventListener('pointermove', (e) => {
    if (lastX !== null) gust = Math.min(1.5, gust + Math.abs(e.clientX - lastX) / innerWidth * 12);
    lastX = e.clientX;
  }, { passive: true });

  if (!reduce) {
    const puff = (amt, ms) => { if (manual) return; target = amt; setTimeout(() => { if (!manual) target = 0; }, ms); };
    setTimeout(() => puff(0.07, 1500), 3000);
    setInterval(() => puff(0.05, 1300), 11000);
  }
})();
</script>
</body>
</html>
