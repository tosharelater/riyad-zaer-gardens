<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Riyad Zaer Gardens — Coming soon</title>
<meta name="description" content="Riyad Zaer Gardens. Demain a déjà son adresse. Coming soon.">
<meta name="theme-color" content="#0b3734">
<link rel="icon" href="assets/logo.png">
<link rel="preload" href="assets/fonts/Audrey-Medium.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="assets/poster-building.webp" as="image">
<style>
  @font-face { font-family: 'RZ Audrey'; src: url(assets/fonts/Audrey-Medium.otf) format('opentype'); font-weight: 500; font-display: swap; }
  @font-face { font-family: 'RZ Audrey'; src: url(assets/fonts/Audrey-Normal.otf) format('opentype'); font-weight: 400; font-display: swap; }

  :root {
    --fill: #0b3734;
    --gold: #c8b568;
    --cream: #f6f0e4;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --W: min(100vw, calc(100svh * 1082 / 1350));
    --u: calc(var(--W) / 1082);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--fill); }
  body {
    min-height: 100svh;
    display: grid;
    place-items: center;
    overflow: hidden;
    background:
      radial-gradient(70% 45% at 50% 22%, #0f4541 0%, transparent 72%),
      var(--fill);
    color: #fff;
    font-family: 'RZ Audrey', 'Cinzel', Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }

  .poster {
    position: relative;
    width: var(--W);
    height: calc(var(--W) * 1350 / 1082);
    flex: none;
  }

  .shape { position: absolute; pointer-events: none; will-change: transform; }
  .shape img { display: block; width: 100%; height: auto; opacity: 0.95; }
  .shape.a { left: calc(var(--u) * 770); top: calc(var(--u) * 40); width: calc(var(--u) * 723); animation: drift-a 30s ease-in-out infinite alternate; }
  .shape.b { left: calc(var(--u) * -398); top: calc(var(--u) * 244); width: calc(var(--u) * 723); animation: drift-b 38s ease-in-out infinite alternate; }
  @keyframes drift-a { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(calc(var(--u) * -18), calc(var(--u) * -14), 0); } }
  @keyframes drift-b { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(calc(var(--u) * 16), calc(var(--u) * 12), 0); } }

  .logo { position: absolute; left: calc(var(--u) * 422); top: calc(var(--u) * 55); width: calc(var(--u) * 237); }
  .logo img { display: block; width: 100%; height: auto; }

  .t {
    position: absolute;
    inset-inline: 0;
    text-align: center;
    text-transform: uppercase;
    white-space: nowrap;
    line-height: 1;
    color: #fff;
  }
  .t.coming { top: calc(var(--u) * 218); font-weight: 500; font-size: calc(var(--u) * 142); letter-spacing: 0.04em; }
  .t.soon { top: calc(var(--u) * 340); font-weight: 500; font-size: calc(var(--u) * 142); letter-spacing: 0.04em; }
  .t.tag { top: calc(var(--u) * 487); font-weight: 400; font-size: calc(var(--u) * 52); letter-spacing: 0.06em; }

  .building {
    position: absolute;
    inset: 0;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 9%, #000 91%, transparent 100%), linear-gradient(to bottom, #000 0, #000 88%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(to right, transparent 0, #000 9%, #000 91%, transparent 100%), linear-gradient(to bottom, #000 0, #000 88%, transparent 100%);
    mask-composite: intersect;
  }
  .building canvas, .building img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .building img { opacity: 0; }
  .no-gl .building img { opacity: 1; }
  .no-gl .building canvas { display: none; }

  .logo, .t, .building { opacity: 0; }
  .go .logo { animation: rise 1.1s var(--ease) 0.15s forwards; }
  .go .t.coming { animation: title 1.5s var(--ease) 0.4s forwards; }
  .go .t.soon { animation: title 1.5s var(--ease) 0.62s forwards; }
  .go .t.tag { animation: rise 1.2s var(--ease) 1s forwards; }
  .go .building { animation: unveil 2.2s var(--ease) 0.7s forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(calc(var(--u) * 16)); } to { opacity: 1; transform: none; } }
  @keyframes title {
    from { opacity: 0; letter-spacing: 0.16em; transform: translateY(calc(var(--u) * 10)); filter: blur(6px); }
    to { opacity: 1; letter-spacing: 0.04em; transform: none; filter: blur(0); }
  }
  @keyframes unveil {
    from { opacity: 0; transform: translateY(calc(var(--u) * 46)) scale(1.02); filter: blur(8px); }
    to { opacity: 1; transform: none; filter: blur(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .shape, .logo, .t, .building { animation: none !important; opacity: 1; transform: none; filter: none; }
  }
</style>
</head>
<body>
<main class="poster" id="poster">
  <div class="shape a" aria-hidden="true"><img src="assets/Shape_1.png" alt=""></div>
  <div class="shape b" aria-hidden="true"><img src="assets/Shape_1_copy.png" alt=""></div>

  <div class="building" role="img" aria-label="Un immeuble de Riyad Zaer Gardens recouvert d'un grand voile vert">
    <canvas id="gl" width="1082" height="1350"></canvas>
    <img src="assets/poster-building.webp" alt="" width="1082" height="1350">
  </div>

  <div class="logo"><img src="assets/logo.png" alt="Riyad Zaer Gardens" width="720" height="468"></div>
  <h1 class="t coming">Coming</h1>
  <p class="t soon" aria-hidden="true">Soon</p>
  <p class="t tag">Demain a déjà son adresse</p>
</main>

<script>
(() => {
  const root = document.documentElement;
  const poster = document.getElementById('poster');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const start = () => { poster.classList.add('go'); document.body.classList.add('go'); };
  (document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 900))]) : Promise.resolve()).then(start);

  const cv = document.getElementById('gl');
  const gl = cv.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: false });
  if (!gl) { document.body.classList.add('no-gl'); return; }

  const vs = `attribute vec2 p; varying vec2 uv;
    void main(){ uv = vec2(p.x*0.5+0.5, 0.5-p.y*0.5); gl_Position = vec4(p,0.0,1.0); }`;
  const fs = `precision mediump float;
    uniform sampler2D uI; uniform sampler2D uM;
    uniform float t; uniform float amp; uniform float gust; uniform float mx;
    varying vec2 uv;
    void main(){
      float m = texture2D(uM, uv).r;
      float wy = smoothstep(0.40, 0.60, uv.y) * (1.0 - smoothstep(0.80, 0.88, uv.y));
      float w = m * (0.25 + 0.75 * wy);
      float k = amp * (1.0 + gust);
      vec2 d = vec2(
        sin(uv.y*16.0 + t*1.25 + uv.x*5.0)*0.6 + sin(uv.y*37.0 - t*1.9 + uv.x*13.0)*0.25,
        cos(uv.x*20.0 + t*0.95 + uv.y*4.0)*0.35 + sin(uv.x*41.0 + t*1.6)*0.12);
      vec2 uv2 = uv + d * w * k * vec2(0.0048, 0.0034) + vec2((mx-0.5)*0.005*w, 0.0);
      vec4 c = texture2D(uI, uv2);
      float l = dot(c.rgb, vec3(0.30, 0.59, 0.11)) / max(c.a, 0.001);
      float band = uv.x*0.9 + uv.y*0.55 - t*0.045;
      float sw = exp(-pow((fract(band) - 0.5) * 7.0, 2.0));
      float ridge = smoothstep(0.16, 0.5, l);
      c.rgb += vec3(0.55, 0.5, 0.24) * sw * ridge * m * 0.4 * c.a;
      c.rgb *= 1.0 + d.x * 0.1 * m * k;
      gl_FragColor = c;
    }`;
  function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { document.body.classList.add('no-gl'); return; }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const U = (n) => gl.getUniformLocation(prog, n);
  const uT = U('t'), uAmp = U('amp'), uGust = U('gust'), uMx = U('mx');
  gl.uniform1i(U('uI'), 0); gl.uniform1i(U('uM'), 1);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);

  function tex(unit, image) {
    const tx = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tx);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }
  const load = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

  let gust = 0, mx = 0.5, t = 0, last = performance.now(), born = last;
  addEventListener('pointermove', (e) => {
    const nx = e.clientX / innerWidth;
    gust = Math.min(2.2, gust + Math.abs(nx - mx) * 9);
    mx = nx;
  }, { passive: true });
  addEventListener('pointerdown', () => { gust = Math.min(2.6, gust + 1.4); });

  Promise.all([load('assets/poster-building.webp'), load('assets/cloth-mask.png')]).then(([a, b]) => {
    tex(0, a); tex(1, b);
    gl.viewport(0, 0, cv.width, cv.height);
    gl.clearColor(0, 0, 0, 0);
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
      gust *= Math.exp(-dt * 1.3);
      const age = (now - born) / 1000;
      const settle = 1 + 1.6 * Math.exp(-Math.max(0, age - 0.8) / 2.6);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform1f(uT, t);
      gl.uniform1f(uAmp, reduce ? 0 : 0.85 * settle);
      gl.uniform1f(uGust, reduce ? 0 : gust);
      gl.uniform1f(uMx, mx);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }).catch(() => document.body.classList.add('no-gl'));
})();
</script>
</body>
</html>
